version: '3.8'

services:
  # Base de datos MySQL
  db:
    image: mysql:8.0
    container_name: pasteleria-mysql
    restart: always
    env_file:
      - ./backend/.env
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  # Backend 
  backend:
    build:
      context: ./backend
    container_name: pasteleria-backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      - DB_HOST=db
    ports:
      - "4000:4000"
    depends_on:
      - db

  #Frontend
  frontend:
    build:
      context: ./frontend
    container_name: pasteleria-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data: